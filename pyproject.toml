[project]
name = "excel-vba-mcp"
version = "0.1.0"
description = "Local MCP server for controlled Excel VBA inspection and automation on Windows (Stage 1)"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "Proprietary" }
authors = [{ name = "xlvba-mcp" }]
dependencies = [
  "mcp>=2.3,<3",
  "pydantic>=2.0.0",
  "pywin32>=306",
  "comtypes>=1.2.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
]

[project.scripts]
excel-vba-mcp = "excel_vba_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/excel_vba_mcp"]

[tool.ruff]
line-length = 100
# Compatibility floor is Python 3.11 (the project's declared minimum); the
# validated development runtime is 3.14 (see .python-version / README).
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
packages = ["excel_vba_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration_excel: tests that drive a live Excel COM instance on Windows (skipped when unavailable)",
]
